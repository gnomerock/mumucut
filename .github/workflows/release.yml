name: Release

# Every push to main (a merged pull request is a push) builds the Windows app and publishes a
# GitHub Release: installer .exe, .msi, a portable .exe and the signed update feed (latest.json)
# that installed copies of the app read to update themselves.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   TAURI_SIGNING_PRIVATE_KEY           content of the updater private key (mumucut.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty string when the key has none)
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The updater only offers a build whose version is higher than the installed one, so every
      # run gets its own version: <major>.<minor> from tauri.conf.json plus the run number as patch.
      - name: Version for this build
        id: meta
        shell: bash
        run: |
          base=$(node -p "require('./src-tauri/tauri.conf.json').version.split('.').slice(0,2).join('.')")
          version="${base}.${GITHUB_RUN_NUMBER}"
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = '${version}';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
            const toml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8').replace(/^version = \".*\"/m, 'version = \"${version}\"');
            fs.writeFileSync('src-tauri/Cargo.toml', toml);
          "
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Build and publish release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: MumuCut ${{ steps.meta.outputs.version }}
          releaseBody: |
            Windows build of MumuCut from commit ${{ github.sha }}.
            - `MumuCut_*_x64-setup.exe`: installer
            - `MumuCut_*_x64_en-US.msi`: MSI installer
            - `MumuCut_portable_x64.exe`: portable app (no auto-install; needs the Microsoft Edge WebView2 runtime, already on Windows 11)
            - `latest.json`: signed update feed read by the app's auto-update
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Attach portable exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/release/mumucut.exe MumuCut_portable_x64.exe
          gh release upload "${{ steps.meta.outputs.tag }}" MumuCut_portable_x64.exe --clobber
