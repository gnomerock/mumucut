[package]
name = "mumucut"
version = "0.1.0"
description = "MumuCut - สร้างคลิปสั้นแบบ flow เดียวกับคลิปธรรมะ"
edition = "2021"

[lib]
name = "mumucut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4.45"
csv = "1.4.0"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tokio = { version = "1.54.1", features = ["process", "io-util", "rt", "time", "macros", "sync"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tauri = { version = "2", features = ["test", "protocol-asset"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
